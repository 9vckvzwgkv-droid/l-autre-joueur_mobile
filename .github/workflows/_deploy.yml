
name: Deploy L'Autre Joueur

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract game
        run: |
          unzip - LAutreJoueur_Mobile_Edition_Pixel_QA22_RECONSTRUCTION_MENUS.zip -d unpacked
          test -f unpacked/laj_pixel_work/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: unpacked/laj_pixel_work

      - name: Deploy
        uses: actions/deploy-pages@v4
