name: Deploy L'Autre Joueur

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract game
        run: |
          mkdir -p extracted site
          unzip -q LAutreJoueur_Mobile_Edition_Pixel_TEST_MOBILE.zip -d extracted
          cp extracted/index.html extracted/*.css extracted/*.js extracted/manifest.webmanifest site/
          cp -R extracted/art extracted/audio extracted/icons site/
          test -f site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
